
<!doctype html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmovi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <h2>Dodavanje filma</h2>

        <div class="form-group">
            <label>Naziv filma</label>
            <input type="text" id="title">
        </div>

        <div class="form-group">
            <label>Žanr</label>
            <input type="text" id="genre">
        </div>

        <div class="form-group">
            <label>Režiser</label>
            <input type="text" id="director">
        </div>

        <div class="form-group">
            <label>Godina izlaska</label>
            <input type="number" id="year">
        </div>

        <div class="form-group">
            <label>Uloženi budžet (USD)</label>
            <input type="number" id="budget" step="any">
        </div>

        <button type="button" onclick="AddMovie()">
            Dodaj film
        </button>

        <hr>

        <button type="button" onclick="LoadAllMovies()">
            Učitaj filmove
        </button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Naziv filma</th>
                    <th>Žanr</th>
                    <th>Režiser</th>
                    <th>Godina izlaska</th>
                    <th>Uloženi budžet</th>
                    <th>Status filma</th>
                </tr>
            </thead>

            <tbody id="movieTableBody"></tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
