<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <title>Knjige</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <div class="container">

      <h2>Dodavanje knjige</h2>

      <div class="form-group">
        <label>Naziv knjige</label>
        <input type="text" id="title" />
      </div>

      <div class="form-group">
        <label>Autor</label>
        <input type="text" id="author" />
      </div>

      <div class="form-group">
        <label>Žanr</label>
        <input type="text" id="genre" />
      </div>

      <div class="form-group">
        <label>Godina izdavanja</label>
        <input type="number" id="year" />
      </div>

      <button onclick="AddBook()">Dodaj knjigu</button>

      <hr />

      <button onclick="LoadAllBooks()">Učitaj knjige</button>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Naziv knjige</th>
            <th>Autor</th>
            <th>Žanr</th>
            <th>Godina izdavanja</th>
            <th>Opis</th>
          </tr>
        </thead>

        <tbody id="bookTableBody"></tbody>

      </table>

    </div>

    <script src="script.js"></script>

  </body>
</html>
